{% extends "layout.html" %}

{% block main %}
<section class="hero">
    <div class="hero-text">
        <span class="badge">Painel Escolar</span>
        <h1>Bem-vindo ao meu espaço escolar</h1>
        <p class="lead">Aqui você encontra meu boletim escolar, desempenho nas matérias e um resumo sobre quem sou.</p>
        <div class="cta-row">
            <a class="btn btn-primary" href="/boletim">Ver boletim</a>
            <a class="btn btn-secondary" href="/sobre-mim">Sobre mim</a>
        </div>
    </div>

    <aside class="student-card">
        <div class="profile-photo">
            <span>AR</span>
        </div>
        <div class="profile-info">
            <h3>Arthur</h3>
            <p>Aluno do 1º ano do Ensino Médio</p>
            <div class="mini-stats">
                <div>
                    <span class="value">8,6</span>
                    <span class="label">Média geral</span>
                </div>
                <div>
                    <span class="value">16</span>
                    <span class="label">Anos</span>
                </div>
            </div>
        </div>
    </aside>
</section>
{% endblock %}
