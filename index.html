<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Escolar | Arthur</title>
    <link rel="stylesheet" href="/static/menu.css">
</head>
<body>
    <header class="site-header">
        <div class="container nav-wrapper">
            <a href="index.html" class="brand">Arthur School</a>
            <nav class="menu">
                <a href="index.html" class="active">Home</a>
                <a href="boletim.html">Boletim</a>
                <a href="sobre_mim.html">Sobre mim</a>
            </nav>
        </div>
    </header>

    <main class="main-content home-page">
        <section class="hero">
            <div class="hero-text">
                <span class="badge">Painel Escolar</span>
                <h1>Bem-vindo ao meu espaço escolar</h1>
                <p class="lead">Aqui você encontra meu boletim escolar, desempenho nas matérias e um resumo sobre quem sou.</p>
                <div class="cta-row">
                    <a class="btn btn-primary" href="boletim.html">Ver boletim</a>
                    <a class="btn btn-secondary" href="sobre_mim.html">Sobre mim</a>
                </div>
            </div>

            <aside class="student-card">
                <div class="profile-photo">
                    <span>AR</span>
                </div>
                <div class="profile-info">
                    <h3>Arthur</h3>
                    <p>Aluno do 1º ano do Ensino Médio</p>
                    <div class="mini-stats">
                        <div>
                            <span class="value">8,6</span>
                            <span class="label">Média geral</span>
                        </div>
                        <div>
                            <span class="value">16</span>
                            <span class="label">Anos</span>
                        </div>
                    </div>
                </div>
            </aside>
        </section>
    </main>
</body>
</html>
